name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches the pinned libc16 release (scripts/fetch-libc16) and
      # the Open Watcom snapshot it names; the snapshot is cached per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      - name: Install DOSBox-X, QEMU and the FAT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x qemu-system-x86 mtools dosfstools

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Test on GR-DOS
        run: make test-grdos

      # The same sources and toolchain give the same du.exe.
      - name: Check the build is reproducible
        run: |
          sha256sum du.exe > build/du.exe.sha256
          rm -f du.exe build/dos/*.obj
          make du.exe
          sha256sum -c build/du.exe.sha256
