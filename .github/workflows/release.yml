name: release

# main only changes by merging a PR, so a push to main is a merge.
# If VERSION names a version without a tag, build and test that merge
# commit, tag it v<VERSION> and publish a release with du.exe, its
# SHA-256 and the GR-DOS help topic attached.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # make fetches the pinned libc16 release (scripts/fetch-libc16) and
      # the Open Watcom snapshot it names.

      - name: Install DOSBox-X, QEMU and the FAT tools
        if: steps.version.outputs.new == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x qemu-system-x86 mtools dosfstools

      - name: Build and test
        if: steps.version.outputs.new == 'true'
        run: |
          make
          make test
          make test-grdos
          sha256sum du.exe > du.exe.sha256
          cp help/DU.txt DU.txt

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "SHA-256 of du.exe, built from $GITHUB_SHA:"
            echo
            echo '```text'
            cat du.exe.sha256
            echo '```'
            echo
            echo '`DU.txt` is the `HELP DU` topic for GR-DOS (`help/topics`).'
          } > notes.md
          gh release create "v$VERSION" du.exe du.exe.sha256 DU.txt \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --generate-notes
